<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Xu Notes - 记录阅读、思考与实践。"
    />
    <title>Xu Notes</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <a class="brand" href="/">Xu Notes</a>
        <nav aria-label="主要导航">
          <a href="#about">关于</a>
          <a href="#notes">笔记</a>
          <a href="mailto:hello@xunotes.com">联系</a>
        </nav>
      </header>

      <section class="hero">
        <p class="eyebrow">PERSONAL NOTES</p>
        <h1>记录阅读、思考与实践。</h1>
        <p class="intro">
          这里是我的个人主页。我会在这里整理笔记、项目和持续关注的主题。
        </p>
        <a class="button" href="#notes">浏览笔记</a>
      </section>

      <section class="section" id="notes">
        <div class="section-heading">
          <p class="eyebrow">LATEST</p>
          <h2>最近更新</h2>
        </div>
        <div class="note-grid">
          <article class="note-card">
            <p class="note-meta">欢迎页 · 2026</p>
            <h3>网站正在建设中</h3>
            <p>第一版主页已经上线。后续会逐步补充文章、项目和联系方式。</p>
          </article>
          <article class="note-card muted">
            <p class="note-meta">下一篇</p>
            <h3>新的笔记即将发布</h3>
            <p>这里可以替换成你的文章标题、摘要和链接。</p>
          </article>
        </div>
      </section>

      <section class="section about" id="about">
        <p class="eyebrow">ABOUT</p>
        <h2>关于本站</h2>
        <p>
          Xu Notes 是一个简单、长期维护的个人空间，用于保存值得反复查看的内容。
        </p>
      </section>

      <footer>
        <p>© 2026 Xu Notes</p>
        <p><a href="mailto:hello@xunotes.com">hello@xunotes.com</a></p>
      </footer>
    </main>
  </body>
</html>
