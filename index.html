<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Xu Notes - 记录投资、技术与生活。" />
    <title>Xu Notes</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell home-shell">
      <header class="site-header">
        <a class="brand" href="./index.html">Xu Notes</a>
        <nav class="site-nav" aria-label="主要导航">
          <a href="#about" data-i18n="nav.about">关于</a>
          <a href="./exchange.html" data-i18n="nav.exchange">交流</a>
          <button class="language-switch" type="button" data-language-switch>
            English
          </button>
        </nav>
      </header>

      <main class="home-main">
        <section class="home-intro">
          <p class="eyebrow">XU NOTES</p>
          <h1 data-i18n="home.title">记录值得反复查看的内容。</h1>
          <p data-i18n="home.subtitle">
            一个关于投资、技术与生活的个人空间。
          </p>
        </section>

        <section class="category-grid" aria-label="内容栏目">
          <a class="category-card featured" href="./category.html?category=investment">
            <span class="category-number">01</span>
            <h2 data-i18n="categories.investment">投资</h2>
            <p data-i18n="categoryDescriptions.investment">市场观察、研究与实践记录。</p>
          </a>
          <a class="category-card featured" href="./category.html?category=technology">
            <span class="category-number">02</span>
            <h2 data-i18n="categories.technology">技术</h2>
            <p data-i18n="categoryDescriptions.technology">工具、方法与项目笔记。</p>
          </a>
          <div class="category-card life-card">
            <span class="category-number">03</span>
            <h2 data-i18n="categories.life">生活</h2>
            <p data-i18n="categoryDescriptions.life">日常经验与长期关注。</p>
            <div class="life-links">
              <a href="./category.html?category=food" data-i18n="categories.food">美食</a>
              <a href="./category.html?category=travel" data-i18n="categories.travel">旅游</a>
              <a href="./category.html?category=health" data-i18n="categories.health">健康</a>
              <a href="./category.html?category=other" data-i18n="categories.other">其它</a>
            </div>
          </div>
        </section>
      </main>

      <footer class="home-footer" id="about">
        <div>
          <p class="footer-title" data-i18n="about.title">关于本站</p>
          <p data-i18n="about.body">
            Xu Notes 是一个简单、长期维护的个人空间，用于保存值得反复查看的内容。
          </p>
        </div>
        <p class="copyright">© 2026 Xu Notes</p>
      </footer>
    </div>
    <script src="./site.js"></script>
  </body>
</html>
